services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PORT=8000
      - MY_PROJECT=Hello World Again.!
    env_file:
      - .env.sample
    volumes:
      - ./backend/src:/app
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app
        - action: rebuild
          path: ./backend/requirements.txt
          target: /app
        - action: restart
          path: ./backend/src
          target: /app